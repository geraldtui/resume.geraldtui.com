career-profile:
  title: ABOUT ME
  summary: |
    A highly experienced IT Leader and Strategist with a Masters in IT and over a
    decade in senior-level roles. My expertise encompasses strategic planning,
    project management, IT budgeting, software, systems and infrastructure support.

    With a robust background in software, systems, and cloud engineering, I have
    assisted businesses in designing and implementing bespoke software, secure
    infrastructures, and scalable cloud solutions. I am dedicated to cultivating a
    culture of technical excellence by leading through example and sharing my
    enthusiasm for technology with my colleagues.
