---
#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en"> <!--<![endif]-->
{% include head.html %}

<body class="print-page">
  <button onclick="print()" class="print-button d-print-none">
    <i class="fas fa-print"></i>Print
  </button>

  <div class="zoom-controls d-print-none" role="group" aria-label="Zoom controls">
    <button type="button" class="zoom-button" id="zoomOutButton" aria-label="Zoom out" title="Zoom out">
      <i class="fas fa-magnifying-glass-minus"></i>
    </button>
    <span class="zoom-level" id="zoomLevel" aria-live="polite">100%</span>
    <button type="button" class="zoom-button" id="zoomInButton" aria-label="Zoom in" title="Zoom in">
      <i class="fas fa-magnifying-glass-plus"></i>
    </button>
  </div>

  <div class="zoom-viewport">
    <div class="resume-wrapper">
      {% include sidebar-print.html %}

      <div class="main-wrapper">
        {{ content }}
      </div>
    </div>
  </div>

  {% include scripts.html %}
  <script src="{{ site.baseurl }}/assets/js/zoom.js"></script>
</body>

</html>
